    {tipo: independiente, revisado: false,
     propiedad: "Editorial Azeta S.A. (Grupo ABC Comunicaciones), fundado en 1967 por Aldo Zuccolillo; dirige Natalia Zuccolillo. El grupo Zuccolillo figura como inversionista en otros negocios (p. ej. Biggie, según el propio diario).",
     fuentes: ["https://en.wikipedia.org/wiki/ABC_Color", "https://www.abc.com.py/edicion-impresa/editorial/2025/08/13/por-orden-del-presidente-de-la-republica-en-abc-color-no-nos-vamos-a-callar/"],
     pendiente: "Línea editorial actual frente al gobierno y rectificaciones: sin evidencia sistemática."}
