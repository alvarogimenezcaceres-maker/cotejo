# Clasificación de medios de Cotejo (eje editorial, no izquierda-derecha).
# Criterios (ver docs/metodologia.md): propiedad, vínculos, línea editorial, rectificaciones.
# Valores de tipo: oficialismo | independiente | critico | publico | fuente_primaria
# revisado: false = clasificación PROVISIONAL. Mientras sea false, el campo `tipo` es un valor
# de relleno (no una conclusión) y el sitio no muestra el punto ciego. Pasa a true solo cuando
# propiedad, vínculos, línea editorial y rectificaciones tienen evidencia y alguien la revisó.
# `propiedad` y `fuentes` recogen datos con respaldo público (2026-11-10); "sin dato" = no verificado.
media:
