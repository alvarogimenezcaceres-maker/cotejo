# Criterio temático de Cotejo: política y economía de Paraguay y sus nexos internacionales.
# Se aplica a título + fragmento al ingerir (sin tildes ni mayúsculas, palabra completa).
# Una nota se guarda si:
#   1. contiene un término de `propios` (instituciones y actores políticos de Paraguay); o
#   2. contiene un actor extranjero de `internacional` Y un marcador de `paraguay` (nexo); o
#   3. no menciona actores extranjeros y contiene un término de `politica` o `economia`.
# Una nota con actores extranjeros y sin vínculo con Paraguay se descarta.
# Las secciones del sitio salen de estas mismas listas: un hecho con actor extranjero y
# marcador de Paraguay va en "Nexos internacionales"; si no, gana la lista con más coincidencias.
# Los términos son públicos a propósito: quien quiera ver qué se incluye y qué no, lo ve aquí.

