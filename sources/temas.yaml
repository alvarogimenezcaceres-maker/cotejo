# Criterio temático de Cotejo: economía de Paraguay, con prioridad al mercado de valores.
# Se aplica a título + fragmento al ingerir (sin tildes ni mayúsculas, palabra completa).
# Una nota se guarda si:
#   1. no menciona actores extranjeros y contiene un término de `bolsa` o `economia`; o
#   2. menciona un actor extranjero de `internacional`, un marcador de `paraguay` Y un término
#      de `bolsa` o `economia` (nexo económico de Paraguay con el exterior).
# Una nota con actores extranjeros y sin vínculo con Paraguay se descarta. La política sin
# componente económico queda fuera.
# Secciones del sitio: un hecho con algún término de `bolsa` va en "Mercado de valores";
# el resto en "Economía".
# Los términos son públicos a propósito: quien quiera ver qué se incluye y qué no, lo ve aquí.

