services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cotejo
      POSTGRES_USER: cotejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cotejo_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  pgdata:
